<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1C1F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-180.png">
<title>Mi agenda</title>
<style>
/* Concepto: el calendario se lee como Google Calendar (cuadrícula blanca, hoy en un círculo azul, eventos en bloques de color)
   y las tareas como Recordatorios de Apple (casillas redondas del color de su lista, listas con su color, accesos rápidos con contador). */
:root{
  --bg:#FFFFFF; --side:#F6F8FC; --panel:#FFFFFF; --ink:#1F1F1F; --ink2:#5F6368; --ink3:#9AA0A6; --line:#DADCE0; --hair:#ECEEF1;
  --accent:#1A73E8; --accent-bg:#E8F0FE; --on-accent:#FFFFFF;
  --late:#D93025; --late-bg:#FCE8E6; --warn-bg:#FEF7E0; --flag:#E8710A; --okc:#188038; --now:#EA4335;
  --uni:#3F51B5; --work:#039BE5; --estambul:#B5650B; --personal:#616161; --hosp:#0B8043; --holiday:#33B679; --ev-ink:#FFFFFF;
  --t-hoy:#1A73E8; --t-cal:#188038;
  --sh1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --sh2:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3);
  --f-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:var(--f-sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1C1F; --side:#202124; --panel:#28292D; --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#6F757B; --line:#3C4043; --hair:#2F3135;
  --accent:#8AB4F8; --accent-bg:#26354F; --on-accent:#0B1A33;
  --late:#F28B82; --late-bg:#3C2321; --warn-bg:#3A3320; --flag:#FCAD70; --okc:#81C995; --now:#F28B82;
  --uni:#8C9EFF; --work:#4FC3F7; --estambul:#FFB74D; --personal:#BDC1C6; --hosp:#81C995; --holiday:#A8DAB5; --ev-ink:#111317;
  --t-hoy:#8AB4F8; --t-cal:#81C995; --t-prog:#FCAD70; --t-all:#BDC1C6;
  --sh1:0 1px 3px rgba(0,0,0,.6); --sh2:0 6px 18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1C1F; --side:#202124; --panel:#28292D; --ink:#E8EAED; --ink2:#9AA0A6; --ink3:#6F757B; --line:#3C4043; --hair:#2F3135;
  --accent:#8AB4F8; --accent-bg:#26354F; --on-accent:#0B1A33;
  --late:#F28B82; --late-bg:#3C2321; --warn-bg:#3A3320; --flag:#FCAD70; --okc:#81C995; --now:#F28B82;
  --uni:#8C9EFF; --work:#4FC3F7; --estambul:#FFB74D; --personal:#BDC1C6; --hosp:#81C995; --holiday:#A8DAB5; --ev-ink:#111317;
  --t-hoy:#8AB4F8; --t-cal:#81C995; --t-prog:#FCAD70; --t-all:#BDC1C6;
  --sh1:0 1px 3px rgba(0,0,0,.6); --sh2:0 6px 18px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 14.5px/1.45 var(--f-sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Estructura */
.side{display:none}
.main{padding:8px 16px 150px;max-width:1180px;margin:0 auto}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font:600 17px var(--f-sans)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:18px;height:18px;stroke:var(--on-accent);stroke-width:2.6}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--hair)}
.icon-btn svg{width:22px;height:22px}
@media(min-width:1000px){
  .side{display:flex;flex-direction:column;gap:18px;position:fixed;inset:0 auto 0 0;width:276px;background:var(--side);padding:16px 14px 14px;overflow-y:auto;z-index:20}
  .main{margin-left:276px;padding:22px 34px 48px;max-width:none}
  .mtop,.nav,.fab,.monly{display:none!important}
}
.side .brand{padding:2px 6px}
.create{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 22px 0 16px;border-radius:16px;background:var(--panel);box-shadow:var(--sh1);font:500 15px var(--f-sans);width:fit-content;transition:box-shadow .15s}
.create:hover{box-shadow:var(--sh2)}
.create svg{width:24px;height:24px;stroke:var(--accent);stroke-width:2.4}

/* Mini calendario */
.mm-h{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px 8px;font:500 14px var(--f-sans)}
.mm-h>span:first-child::first-letter{text-transform:uppercase}
.mm-h button{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink2)}
.mm-h button:hover{background:var(--hair)}
.mm-h svg{width:18px;height:18px}
.mm-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:1px;text-align:center}
.mm-g span{font:500 11px/26px var(--f-sans);color:var(--ink2)}
.mm-g button{width:28px;height:28px;margin:auto;border-radius:50%;display:grid;place-items:center;font:400 12px var(--f-sans);position:relative}
.mm-g button:hover{background:var(--hair)}
.mm-g button.o{color:var(--ink3)}
.mm-g button.s{background:var(--accent-bg);color:var(--accent);font-weight:600}
.mm-g button.t{background:var(--accent);color:var(--on-accent);font-weight:600}
.mm-g button.d::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--flag)}
.mm-g button.t.d::after{background:var(--on-accent)}

/* Accesos rápidos */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel);border-radius:12px;padding:9px 11px 8px;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;box-shadow:0 0 0 1px var(--hair);transition:background .12s}
.tile:hover{box-shadow:0 0 0 1px var(--line)}
.tile .ic{width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.tile .ic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.2}
.tile b{justify-self:end;font:700 21px/1 var(--f-sans)}
.tile span{grid-column:1/3;font:600 13px var(--f-sans);color:var(--ink2)}
.tile[aria-current="page"]{background:var(--c);box-shadow:none}
.tile[aria-current="page"] .ic{background:rgba(255,255,255,.95)}
.tile[aria-current="page"] .ic svg{stroke:var(--c)}
.tile[aria-current="page"] b,.tile[aria-current="page"] span{color:#fff}
.lists h4{margin:0 0 2px 10px;font:600 13px var(--f-sans);color:var(--ink2)}
.li{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border-radius:20px;font:400 14.5px var(--f-sans);color:var(--ink)}
.li:hover{background:var(--hair)}
.li[aria-current="page"]{background:var(--accent-bg);font-weight:600}
.li .dotc{width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.li .dotc svg{width:14px;height:14px;stroke:#fff;stroke-width:2.2}
.li>svg{width:20px;height:20px;color:var(--ink2);margin:0 2px}
.li em{margin-left:auto;font-style:normal;color:var(--ink2);font-size:13.5px}
.sfoot2{margin-top:auto;display:grid;gap:4px}
.sync{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:12.5px;color:var(--ink2);width:100%}
.sync:hover{background:var(--hair)}
.sync b{display:block;font-weight:600;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none;display:inline-block}
.dot.ok{background:var(--okc)}.dot.warn{background:var(--flag)}.dot.bad{background:var(--late)}

/* Móvil: barra inferior y botón redondo */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--side);border-top:1px solid var(--hair)}
.nav button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 12px var(--f-sans);color:var(--ink2);position:relative;text-align:center}
.nav button svg{width:24px;height:24px;padding:0;border-radius:16px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav button[aria-current="page"] svg{background:var(--accent-bg);color:var(--accent);width:56px;padding:2px 16px}
.nav .cnt{position:absolute;top:4px;left:calc(50% + 10px);font:600 11px var(--f-sans);background:var(--late);color:#fff;border-radius:9px;padding:0 6px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--sh2)}
.fab svg{width:26px;height:26px;stroke-width:2.4}

/* Encabezados y controles */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 18px}
h1{margin:0;font:700 32px/1.15 var(--f-sans);letter-spacing:-.01em;color:var(--hc,var(--ink))}
.sub{margin:3px 0 0;color:var(--ink2);font-size:15px}
.sub::first-letter{text-transform:uppercase}
h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 6px;font:600 17px var(--f-sans)}
h2 small{font:400 13px var(--f-sans);color:var(--ink2)}
.btn{min-height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);font:500 14px var(--f-sans);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13.5px}
.btn.danger{color:var(--late);border-color:transparent}
.btn.danger:hover{background:var(--late-bg)}
.btn.danger.arm{background:var(--late);color:#fff}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--hair)}
.ib svg{width:20px;height:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{min-height:34px;padding:0 16px;font:500 14px var(--f-sans);color:var(--ink);text-align:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);margin-bottom:14px;font-size:14px}
.banner span{flex:1;min-width:200px}
.banner.bad{background:var(--late-bg)}
.empty{padding:12px 4px;color:var(--ink2);font-size:14.5px}

/* A continuación */
.next{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:12px;background:var(--accent-bg);margin-bottom:22px}
.next .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.next .tx{flex:1;min-width:180px}
.next .k{font-size:13px;color:var(--ink2)}
.next .t{font:600 16px/1.3 var(--f-sans);overflow-wrap:anywhere}

/* Hoy */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
@media(min-width:1000px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px}}
.ag{display:grid;grid-template-columns:78px 10px minmax(0,1fr);gap:0 12px;align-items:start;width:100%;padding:9px 8px;border-radius:10px}
.ag:hover{background:var(--hair)}
.ag .h{font:500 13.5px/1.35 var(--f-sans)}
.ag .h small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2)}
.ag>i{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px}
.ag .b{min-width:0}
.ag .b b{display:block;font-weight:500;overflow-wrap:anywhere}
.ag .b span{display:block;font-size:13px;color:var(--ink2)}
.ag.past{opacity:.5}
.ag.now{background:var(--accent-bg)}
.ag.now .b span{color:var(--accent);font-weight:500}

/* Tareas al estilo Recordatorios */
.tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:start;column-gap:6px;position:relative}
.tr::after{content:"";position:absolute;left:40px;right:0;bottom:0;height:1px;background:var(--hair)}
.cb{width:34px;height:40px;display:grid;place-items:center}
.cb i{width:21px;height:21px;border-radius:50%;border:1.6px solid var(--c);display:grid;place-items:center;transition:background .12s,box-shadow .12s}
.cb:hover i{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 16%,transparent)}
.cb svg{width:12px;height:12px;stroke:#fff;stroke-width:3.2;opacity:0}
.st-done .cb i{background:var(--c)}
.st-done .cb svg{opacity:1}
.tx{min-width:0;padding:9px 0 10px}
.tt{display:block;width:100%;font:400 15px/1.35 var(--f-sans);overflow-wrap:anywhere;text-align:left}
.st-done .tt{color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:0 6px;margin-top:2px;font-size:13px;color:var(--ink2)}
.meta span+span::before{content:"·";margin-right:6px;color:var(--ink3)}
.meta .late{color:var(--late)}
.meta .hoy{color:var(--accent)}
.flag{padding:11px 2px 0 6px;color:var(--flag)}
.flag svg{width:16px;height:16px;stroke-width:2}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.grp{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 0;padding-bottom:4px;font:600 15px var(--f-sans);border-bottom:1px solid var(--hair)}
.grp:first-child{margin-top:4px}
.grp small{font:400 13px var(--f-sans);color:var(--ink2)}
.grp.bad{color:var(--late)}
.add{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;color:var(--ink2);font-size:15px;border-radius:8px}
.add:hover{color:var(--accent)}
.add svg{width:22px;height:22px;stroke:var(--accent);stroke-width:2}
.more{display:block;margin-top:14px;color:var(--accent);font:500 14px var(--f-sans)}
.monly{margin-bottom:18px;display:grid;gap:14px}

/* Calendario al estilo Google Calendar */
.ctop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 12px}
.ctop h1{font:400 22px/1.2 var(--f-sans);margin:0 6px;flex:1;min-width:150px}
.ctop h1::first-letter{text-transform:uppercase}
.ctop .seg{margin-left:auto}
@media(max-width:699px){.ctop h1{order:-1;flex-basis:100%;margin:0 0 2px;font-size:20px}}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.sd{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border-radius:12px}
.sd .w{font:500 11.5px var(--f-sans);color:var(--ink2)}
.sd .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:500 16px var(--f-sans)}
.sd.tdy .n{color:var(--accent)}
.sd.sel .n{background:var(--accent);color:var(--on-accent)}
.cgw{overflow-x:auto;border-top:1px solid var(--hair)}
.cg{min-width:var(--minw,0)}
.cg-row{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.cg-h>div{padding:8px 0 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cg-h small{font:500 11.5px var(--f-sans);color:var(--ink2)}
.cg-h .d{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:400 22px var(--f-sans)}
.cg-h .td small{color:var(--accent)}
.cg-h .td .d{background:var(--accent);color:var(--on-accent)}
.cg-a>div{padding:2px 3px 4px;border-left:1px solid var(--hair);border-bottom:1px solid var(--line);display:grid;gap:2px;align-content:start;min-height:12px}
.cg-a>div:first-child{border-left:0}
.al{font:500 12px/1.3 var(--f-sans);border-radius:4px;padding:3px 7px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al.hol{background:var(--holiday);color:var(--ev-ink)}
.al.tk{background:var(--accent-bg);color:var(--accent)}
.al.tk::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid currentColor;border-radius:50%;margin-right:6px;vertical-align:-1px}
.al.tk.late{background:var(--late-bg);color:var(--late)}
.cg-b{position:relative}
.cg-b .hrs{position:relative}
.cg-b .hrs i{position:absolute;right:8px;font:400 11px var(--f-sans);color:var(--ink2);font-style:normal;transform:translateY(-8px)}
.cg-b .hrs i:first-child{display:none}
.dc{position:relative;border-left:1px solid var(--hair);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--hair) calc(var(--hh) - 1px),var(--hair) var(--hh))}
.evb{position:absolute;padding:3px 7px;border-radius:6px;background:var(--c);color:var(--ev-ink);overflow:hidden;font-size:12.5px;line-height:1.25;text-align:left;box-shadow:0 0 0 1px var(--bg)}
.evb:hover{filter:brightness(1.08);box-shadow:var(--sh2)}
.evb b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lc,3);overflow:hidden;font-weight:600;overflow-wrap:anywhere}
.evb span{display:block;font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evb.sh{display:flex;align-items:center;gap:6px;padding-block:0;white-space:nowrap}
.evb.sh b{display:block;flex:1;min-width:0;white-space:nowrap;text-overflow:ellipsis}
.evb.sh b span{display:inline;font-weight:400}
.evb.past{opacity:.55}
.nowl{position:absolute;left:56px;right:0;height:0;border-top:2px solid var(--now);z-index:9;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-6px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--now)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
/* Evaluaciones del trimestre */
.al.ex{background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
.exr{display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 12px;width:100%;padding:9px 8px;border-radius:10px;align-items:start}
.exr:hover{background:var(--hair)}
.exr .when{font:500 13px/1.35 var(--f-sans);color:var(--ink2)}
.exr .when.soon{color:var(--late)}
.exr b{display:block;font-weight:500;overflow-wrap:anywhere}
.exr .meta{margin-top:1px}
.exr .meta span:first-child{color:var(--c);font-weight:500}
.exr.past{opacity:.5}
.tent{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--hair);color:var(--ink2);font:500 11.5px/18px var(--f-sans);vertical-align:1px}
.sq{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}

/* Hojas */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(32,33,36,.45)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh2)}
@media(min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;transform:translate(-50%,-50%);border-radius:16px}}
.sheet h3{margin:0 0 10px;font:500 18px var(--f-sans)}
.sheet input[type=text]{width:100%;min-height:48px;border:0;border-bottom:2px solid var(--line);background:transparent;padding:0 2px;font:400 20px var(--f-sans);outline:0;border-radius:0}
.sheet input[type=text]:focus{border-bottom-color:var(--accent)}
.prev{margin:8px 0 0;min-height:22px;font-size:14px;color:var(--ink2)}
.prev b{color:var(--ink);font-weight:600}
.lbl{margin:16px 0 8px;font:500 13.5px var(--f-sans);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);font:500 13.5px var(--f-sans);display:inline-flex;align-items:center;gap:8px;text-align:center}
.chip:hover{background:var(--hair)}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.f2 label{display:grid;gap:4px;font:500 12.5px var(--f-sans);color:var(--ink2)}
.f2 input{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font:400 15px var(--f-sans);min-width:0}
.f2 input:disabled{opacity:.45}
.f3 label:first-child{grid-column:1/-1}
@media(min-width:560px){.f3{grid-template-columns:1.3fr 1fr 1fr}.f3 label:first-child{grid-column:auto}}
.shh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.shh h3{margin:0}
.shh .seg button{min-height:32px;padding:0 14px;font-size:13.5px}
.hint{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--ink2)}
.hint:empty{display:none}
.evb.tk{background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--ink);box-shadow:inset 3px 0 0 var(--c),0 0 0 1px var(--bg)}
.evb.tk b::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid var(--c);border-radius:50%;margin-right:5px;vertical-align:0}
.evb.tk.done b{text-decoration:line-through}
.sfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:22px}
.sfoot .danger{margin-right:auto}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14.5px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;overflow-wrap:anywhere}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair)}
.sw p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:#303134;color:#F1F3F4;padding:6px 8px 6px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);min-height:44px;box-shadow:var(--sh2)}
.toast button{min-height:34px;padding:0 10px;border-radius:6px;color:#8AB4F8;font:600 14px var(--f-sans)}
@media(min-width:1000px){.toast{left:24px;transform:none;bottom:24px}}
@media(prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;margin-bottom:-8px}}}

/* App instalada */
[hidden]{display:none!important}
.logo{border-radius:50%}
html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
/* iPhone (app en inicio): en páginas cortas la barra de abajo quedaba subida y dejaba una franja; la página cubre también la barra de estado */
html{min-height:calc(100% + env(safe-area-inset-top,0px))}
.nav{box-shadow:0 160px 0 var(--side)}
@media(min-width:1000px){.side{padding-top:calc(16px + env(safe-area-inset-top,0px))}}
.setup-mode .side,.setup-mode .nav,.setup-mode .fab,.setup-mode .fab2{display:none!important}
.setup-mode .main{margin-left:0!important}
.setup{max-width:520px;margin:5vh auto 0;padding:0 4px}
.setup label{display:grid;gap:6px;margin-top:16px;font:500 13.5px var(--f-sans);color:var(--ink2)}
.setup input{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font:400 15px var(--f-sans);color:var(--ink);min-width:0}
.setup input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.setup-err{min-height:20px;margin-top:12px;color:var(--late);font-size:14px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.whob{display:grid;justify-items:center;gap:8px;padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font:500 15px var(--f-sans);color:var(--ink)}
.whob i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent);font:600 18px var(--f-sans);font-style:normal}
.whob[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-bg)}
.whob[aria-pressed="true"] i{background:var(--accent);color:var(--on-accent)}
.qr{display:grid;place-items:center;min-height:120px;padding:14px;background:#fff;color:#111;border-radius:12px;width:fit-content;margin:6px auto 0}
/* Dictado */
.cap{display:flex;align-items:center;gap:10px}
.cap input{flex:1;min-width:0}
.mic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent);flex:none}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--now);color:#fff}
.mic.wait{background:color-mix(in srgb,var(--now) 30%,var(--accent-bg));color:var(--now)}
@media(prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--now) 22%,transparent)}}}
.micbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.lang button{min-height:30px;padding:0 12px;font:500 13px var(--f-sans);color:var(--ink)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent)}
.fab2{position:fixed;right:22px;bottom:calc(152px + env(safe-area-inset-bottom,0px));z-index:31;width:48px;height:48px;border-radius:50%;background:var(--panel);color:var(--accent);display:grid;place-items:center;box-shadow:var(--sh2)}
.fab2 svg{width:23px;height:23px}
@media(min-width:1000px){.fab2{display:none!important}}
</style>

<body>
<aside class="side" id="side"></aside>
<main class="main" id="main"></main>
<nav class="nav" id="nav" aria-label="Secciones"></nav>
<button class="fab2" id="fabMic" aria-label="Dictar una tarea"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
<button class="fab" id="fab" aria-label="Nueva tarea"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Tarea" hidden>
  <div class="shh"><h3 id="shHead">Nueva tarea</h3><div class="seg" id="shKind" role="group" aria-label="Tipo"></div></div>
  <div class="cap"><input type="text" id="shTitle" autocomplete="off" placeholder="Ej: entregar informe viernes 8 am" aria-label="Descripción de la tarea" maxlength="160"><button type="button" class="mic" id="shMic" aria-label="Dictar por voz"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button></div>
  <div class="micbar" id="micBar"><span id="micTxt">Dictar en</span><span class="lang" role="group" aria-label="Idioma del dictado"><button type="button" data-lang="es-US" aria-pressed="true">Español</button><button type="button" data-lang="en-US" aria-pressed="false">English</button></span></div>
  <div class="prev" id="shPrev"></div>
  <div class="lbl">Fecha</div>
  <div class="chips" id="shDue"></div>
  <div class="f2 f3">
    <label for="shDate">Fecha<input type="date" id="shDate"></label>
    <label for="shTime"><span id="shTimeL">Hora (opcional)</span><input type="time" id="shTime"></label>
    <label for="shEnd"><span id="shEndL">Hasta (opcional)</span><input type="time" id="shEnd"></label>
  </div>
  <p class="hint" id="shHint"></p>
  <div id="shRepBox"><div class="lbl">Repetir</div><div class="chips" id="shRep"></div></div>
  <div class="lbl">Lista</div>
  <div class="chips" id="shArea"></div>
  <div id="shPrioBox"><div class="lbl">Prioridad</div>
  <div class="chips" id="shPrio"></div></div>
  <div class="sfoot">
    <button type="button" class="btn danger" id="shDel" hidden>Borrar</button>
    <button type="button" class="btn" id="shCancel">Cancelar</button>
    <button type="button" class="btn primary" id="shSave">Guardar</button>
  </div>
</div>
<div class="sheet" id="sheet2" role="dialog" aria-modal="true" hidden></div>
<div id="toastBox"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const mondayOf=d=>{const x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const at=(d,hhmm)=>{const p=hhmm.split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),p[0],p[1])};
const today=()=>sod(new Date());
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DOWC=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const AREAS={uni:'Universidad',work:'4Geeks',estambul:'Estambul',personal:'Personal'};
const KIND={uni:'Universidad',hosp:'Hospital',work:'4Geeks',holiday:'Feriado'};
const col=a=>'var(--'+((AREAS[a]||KIND[a])?a:'personal')+')';
const plural=(n,a,b)=>n+' '+(n===1?a:b);
const fmt12=hhmm=>{const p=hhmm.split(':').map(Number);const h=p[0]%12||12;return h+(p[1]?':'+pad(p[1]):'')+' '+(p[0]<12?'am':'pm')};
const hm=d=>{const h=d.getHours(),m=d.getMinutes();return (h%12||12)+(m?':'+pad(m):'')+' '+(h<12?'am':'pm')};
const rng=(s,e)=>{const a=hm(s),b=hm(e);return a.slice(-2)===b.slice(-2)?a.slice(0,-3)+'\u2060–\u2060'+b:a+' – '+b}; // sin cortar «4–5:20 pm» en dos líneas
const daysUntil=s=>Math.round((parseYmd(s)-today())/864e5);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ICO={
  hoy:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
  tareas:'<svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M3.5 6.5l1.4 1.4 2.4-2.6M3.5 12l1.4 1.4 2.4-2.6M3.5 17.5l1.4 1.4 2.4-2.6"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  today:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M10.5 15.2l1.2 1.2 2.6-2.8"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  tray:'<svg viewBox="0 0 24 24"><path d="M4 13.5l2.2-6.6A2 2 0 0 1 8.1 5.5h7.8a2 2 0 0 1 1.9 1.4l2.2 6.6V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M10 7h9M10 12h9M10 17h9M5.5 7h.01M5.5 12h.01M5.5 17h.01"/></svg>',
  flag:'<svg viewBox="0 0 24 24"><path d="M6 21V4.5h11l-2.2 4.2L17 13H6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  cap:'<svg viewBox="0 0 24 24"><path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5v4c1.5 1.5 3.4 2.2 5.5 2.2s4-.7 5.5-2.2v-4M21.5 9.5v5"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>'
};

/* ---------- Conexión con tu servidor (hoja de Google) ---------- */
const CFG_KEY='agenda-cfg',SRV_KEY='agenda-servidor',PROF_KEY='agenda-perfil';
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
/* ?k= trae la dirección del servidor y, en el enlace personal, también la clave. Sin clave, la app pide iniciar sesión. */
let LOGIN=false; // abrir el enlace de la app (sin clave) siempre pregunta quién eres, aunque el teléfono ya tenga una sesión
function readCfg(){
  try{const q=new URLSearchParams(location.search).get('k');if(q){const j=JSON.parse(b64d(q));if(j&&j.u&&j.t){lsSet(CFG_KEY,JSON.stringify(j));lsSet(SRV_KEY,j.u);return j}if(j&&j.u){lsSet(SRV_KEY,j.u);LOGIN=true;try{history.replaceState(null,'',location.pathname)}catch(e){}}if(j&&Array.isArray(j.n))lsSet('agenda-nombres',JSON.stringify(j.n.slice(0,2).map(x=>String(x).slice(0,30))))}}catch(e){}
  try{const j=JSON.parse(lsGet(CFG_KEY)||'null');return j&&j.u&&j.t?j:null}catch(e){return null}
}
let CFG=readCfg();
/* Perfil que manda el servidor al iniciar sesión: usuario 1 o 2, su nombre, si tiene Google Calendar y los nombres de sus listas. */
const AREAS0=Object.assign({},AREAS);
let PROF=(()=>{try{return JSON.parse(lsGet(PROF_KEY)||'null')}catch(e){return null}})();
function applyProf(){Object.keys(AREAS0).forEach(k=>{AREAS[k]=(PROF&&PROF.areas&&PROF.areas[k])||AREAS0[k]})}
function takeProf(res){if(!res||!res.user)return;PROF={user:+res.user,name:String(res.name||''),cal:res.cal!==false,areas:res.areas||null};lsSet(PROF_KEY,JSON.stringify(PROF));applyProf()}
const calOn=()=>!PROF||PROF.cal!==false;
applyProf();
const personalLink=()=>CFG?location.origin+location.pathname+'?k='+b64e(JSON.stringify({u:CFG.u,t:CFG.t})):'';

/* ---------- Estado y cola de cambios: todo se guarda primero en el teléfono ---------- */
const LS='agenda-tareas-v1',QK='agenda-cola-v1',BK='agenda-base-v1';
let S=null,view='hoy',list='prog',mmOff=0,calMode=innerWidth>=1000?'week':'day',calOff=0,selDay=ymd(today());
let ACAD=null;
const loadJ=(k,d)=>{try{const v=JSON.parse(lsGet(k)||'null');return v==null?d:v}catch(e){return d}};
let queue=loadJ(QK,[]),base=loadJ(BK,{});
const sig=t=>{const a=[t.title,t.area,t.due||null,t.time||null,!!t.prio,!!t.done,t.doneAt||null,!!t.someday];if(t.end||t.kind)a.push(t.end||null,t.kind||'');return JSON.stringify(a)};
function remember(){base={};S.tasks.forEach(t=>{base[t.id]=sig(t)});lsSet(BK,JSON.stringify(base))}
/* Compara con lo último sincronizado y encola solo lo que cambió (crear, editar, completar, borrar). */
function save(){
  const now=Date.now(),seen={};
  S.tasks.forEach(t=>{seen[t.id]=1;if(base[t.id]!==sig(t)){t.updated=now;queue=queue.filter(o=>o.id!==t.id);queue.push({type:'upsert',id:t.id,updated:now,task:JSON.parse(JSON.stringify(t))})}});
  Object.keys(base).forEach(id=>{if(!seen[id]){queue=queue.filter(o=>o.id!==id);queue.push({type:'delete',id:id,updated:now})}});
  remember();lsSet(LS,JSON.stringify(S));lsSet(QK,JSON.stringify(queue));
  clearTimeout(syncT);syncT=setTimeout(sync,600);
}

let syncing=false,syncT=null,net=navigator.onLine===false?'offline':'idle',netErr='',lastOk=+(lsGet('agenda-ultima')||0),srvOld=false;
const cleanT=t=>{
  const due=t.due||null,time=due&&t.time?t.time:null,end=time&&/^\d{2}:\d{2}$/.test(t.end||'')&&t.end>time?t.end:null;
  return {id:String(t.id),title:String(t.title||''),area:AREAS[t.area]?t.area:'personal',due:due,time:time,end:end,kind:t.kind==='evento'&&time?'evento':'',prio:!!t.prio,done:!!t.done,doneAt:t.doneAt||null,someday:!!t.someday,created:+t.created||0,updated:+t.updated||0,source:t.source||''};
};
/* Un servidor sin actualizar (antes de la versión 4) no guarda la hora de fin ni el tipo: esos cambios esperan en el teléfono. */
const waitsSrv=o=>srvOld&&o.type==='upsert'&&o.task&&!!(o.task.end||o.task.kind);
function calRange(){const f=addDays(mondayOf(today()),-7);return {from:f.toISOString(),to:addDays(f,49).toISOString()}}
function post(body,cfg){
  const c=cfg||CFG,ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=ctl?setTimeout(()=>ctl.abort(),90000):0;
  return fetch(c.u,{method:'POST',body:JSON.stringify(Object.assign({token:c.t},body)),signal:ctl?ctl.signal:undefined,redirect:'follow',credentials:'omit'})
    .then(r=>{clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},e=>{clearTimeout(tm);throw e});
}
function sync(){
  if(!CFG||syncing)return;
  if(navigator.onLine===false){net='offline';render();return}
  syncing=true;const sent=queue.slice();
  post({ops:sent,cal:calRange()}).then(res=>{
    syncing=false;
    if(!res||!res.ok){net=res&&res.error==='clave'?'key':'err';netErr=(res&&res.error)||'respuesta vacía';render();return}
    srvOld=!(res.v>=4);takeProf(res);
    queue=queue.filter(o=>waitsSrv(o)||!sent.some(x=>x.id===o.id&&x.updated===o.updated));lsSet(QK,JSON.stringify(queue));
    const map={};(res.tasks||[]).map(cleanT).forEach(t=>{map[t.id]=t});
    queue.forEach(o=>{if(o.type==='delete')delete map[o.id];else map[o.id]=cleanT(o.task)});
    S={tasks:Object.values(map).sort((a,b)=>(b.created||0)-(a.created||0)),closes:S.closes||[]};
    remember();lsSet(LS,JSON.stringify(S));
    if(Array.isArray(res.events))takeEvents(res.events);
    else if(res.calOk===false){calState={st:calSrc.main?'stale':'err'};calErr=res.calError||''}
    net='ok';netErr='';lastOk=Date.now();lsSet('agenda-ultima',String(lastOk));render();

/* ---------- Piezas ---------- */
const openDated=()=>S.tasks.filter(t=>!t.done&&!t.someday&&t.due&&!isEv(t));
function counts(){
  let late=0,hoy=0,sem=0,prog=0,todas=0;const area={};
  S.tasks.forEach(t=>{
    if(t.done||isEv(t))return;todas++;area[t.area]=(area[t.area]||0)+1;
    if(t.someday||!t.due)return;prog++;
    if(status(t).st==='late')late++;else{const n=daysUntil(t.due);if(n===0)hoy++;else if(n<=7)sem++}
  });

}
function taskRow(t,o){
  o=o||{};const s=status(t),meta=[];
  if(s.st!=='none'||t.someday)meta.push('<span class="'+(s.st==='late'?'late':s.st==='hoy'?'hoy':'')+'">'+esc(s.text)+'</span>');
  if(o.area!==false)meta.push('<span>'+AREAS[t.area]+'</span>');
  return '<div class="tr st-'+s.st+'" data-id="'+t.id+'" style="--c:'+col(t.area)+'">'+
    '<button class="cb" data-a="done" aria-label="'+(t.done?'Marcar como pendiente: ':'Marcar como hecha: ')+esc(t.title)+'"><i>'+ICO.check+'</i></button>'+
    '<div class="tx"><button class="tt" data-a="edit">'+esc(t.title)+'</button>'+(meta.length?'<div class="meta">'+meta.join('')+'</div>':'')+

}
const rows=(arr,o,msg)=>arr.length?arr.map(t=>taskRow(t,o)).join(''):(msg?'<div class="empty">'+msg+'</div>':'');
const addRow=p=>'<button class="add" data-a="addin" data-due="'+((p&&p.due)||'')+'" data-area="'+((p&&p.area)||'')+'">'+ICO.plus+'Nueva tarea</button>';
const LATE_QA={qa:[['today','Pasar a hoy'],['tomorrow','Pasar a mañana']]};
function agRow(e){

  return '<button class="ag'+(past?' past':'')+(cur?' now':'')+'" '+(e.tid?'data-a="edit" data-id="'+esc(e.tid)+'"':'data-a="ev" data-i="'+esc(e.id)+'"')+' style="--c:'+col(e.kind)+'"><span class="h">'+hm(e.s)+'<small>'+hm(e.e)+'</small></span><i></i><span class="b"><b>'+esc(e.title)+'</b><span>'+sub+'</span></span></button>';

/* Evaluaciones: no van en la app pública. */
const MSHORT={},colM=()=>'var(--uni)',evals=()=>[],evalsOn=()=>[],evalRow=()=>'',openEval=()=>{},vEval=()=>'';

/* ---------- Hoy ---------- */

    calBanner()+nextBar()+
    '<div class="cols"><section><h2>Agenda<small>'+plural(evs.length,'evento','eventos')+'</small></h2>'+

        return ex.length?'<h2 style="margin-top:26px">Próximas evaluaciones<small>14 días</small></h2>'+ex.slice(0,6).map(evalRow).join('')+'<button class="more" data-a="list" data-l="eval">Ver todas</button>':''})()+'</section>'+

  return '<div class="tiles">'+T.map(x=>'<button class="tile" data-a="list" data-l="'+x[0]+'" style="--c:'+x[2]+'"'+(on(x[0])?' aria-current="page"':'')+'><i class="ic">'+x[3]+'</i><b>'+x[4]+'</b><span>'+x[1]+'</span></button>').join('')+'</div>';
}

}
function byDue(a,b){return (a.due?dueDate(a):Infinity)-(b.due?dueDate(b):Infinity)||(b.prio-a.prio)}
function vTareas(){

  const open=S.tasks.filter(t=>!t.done&&!isEv(t)&&(!isArea||t.area===list));
  let body='';
  if(list==='done'){
    const d=S.tasks.filter(t=>t.done&&!isEv(t)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,60);
    body=rows(d,{},'Aún no has terminado tareas.');
  }else if(list==='todas'){

    const G=[['Vencidas',t=>status(t).st==='late','bad'],['Hoy',t=>daysUntil(t.due)===0],['Mañana',t=>daysUntil(t.due)===1],['Esta semana',t=>{const n=daysUntil(t.due);return n>=2&&n<=7}],['Próximas dos semanas',t=>{const n=daysUntil(t.due);return n>=8&&n<=14}],['Más adelante',t=>daysUntil(t.due)>14]];
    const used=new Set();

      body+='<div class="grp'+(g[2]?' '+g[2]:'')+'">'+g[0]+'<small>'+it.length+'</small></div>'+rows(it,Object.assign({area:!isArea},g[0]==='Vencidas'?LATE_QA:{}))});

/* ---------- Calendario ---------- */
function blocks(d,H0,H1,hh){
  const ds=sod(d),de=addDays(ds,1),now=new Date();
  const items=timedOn(d).concat(blocksOn(d)).map(e=>({e:e,s:e.s<ds?ds:e.s,en:e.e>de?de:e.e}));
  items.sort((a,b)=>a.s-b.s||b.en-a.en);
  const cl=[];let cur=null;
  items.forEach(it=>{
    if(!cur||it.s>=cur.end){cur={end:it.en,items:[],lanes:[]};cl.push(cur)}
    cur.end=Math.max(cur.end,it.en);let l=0;while(cur.lanes[l]&&cur.lanes[l]>it.s)l++;cur.lanes[l]=it.en;it.lane=l;cur.items.push(it);
  });
  cl.forEach(c=>c.items.forEach(it=>{it.n=c.lanes.length}));
  return items.map(it=>{
    const a=(it.s.getHours()*60+it.s.getMinutes())-H0*60,b=((it.en>=de)?1440:(it.en.getHours()*60+it.en.getMinutes()))-H0*60;
    if(b<=0||a>=(H1-H0)*60)return '';
    const top=Math.max(a,0)/60*hh,h=Math.max((Math.min(b,(H1-H0)*60)-Math.max(a,0))/60*hh-1,24),w=100/it.n,wd=it.lane===it.n-1?w:Math.min(w*1.7,100-it.lane*w);
    const short=h<46,lc=Math.max(1,Math.floor((h-24)/16)),r=rng(it.e.s,it.e.e);
    const tk=it.e.tid&&!it.e.ev;
    return '<button class="evb'+(short?' sh':'')+(it.e.e<=now||it.e.done?' past':'')+(tk?' tk':'')+(it.e.done?' done':'')+'" '+(it.e.tid?'data-a="edit" data-id="'+esc(it.e.tid)+'"':'data-a="ev" data-i="'+esc(it.e.id)+'"')+' title="'+esc(it.e.title)+' · '+r+'" style="--c:'+col(it.e.kind)+';--lc:'+lc+';top:'+top+'px;height:'+h+'px;'+(short?'line-height:'+h+'px;':'')+'left:calc('+(it.lane*w)+'% + 1px);width:calc('+wd+'% - 3px);z-index:'+(it.lane+1)+'">'+(short?'<b>'+esc(it.e.title)+'<span>, '+hm(it.e.s)+'</span></b>':'<b>'+esc(it.e.title)+'</b><span>'+r+'</span>')+'</button>';
  }).join('');
}
function vCal(){
  const td=today(),week=calMode==='week';
  const mon=addDays(mondayOf(td),calOff*7);
  const days=week?[0,1,2,3,4,5,6].map(i=>addDays(mon,i)):[parseYmd(selDay)];
  const H0=7,H1=22,hh=60,k0=ymd(td);
  const head=days.map(d=>'<div class="'+(ymd(d)===k0?'td':'')+'"><small>'+DOW[d.getDay()]+'</small><span class="d">'+d.getDate()+'</span></div>').join('');
  const allr=days.map(d=>{
    const ks=ymd(d),hol=allDayOn(d).map(e=>'<button class="al hol" data-a="ev" data-i="'+esc(e.id)+'" title="'+esc(e.title)+'">'+esc(e.title)+'</button>').join('');
    const tk=S.tasks.filter(t=>t.due===ks&&!t.done&&!t.someday&&(!endOf(t)||t.time>=pad(H1)+':00'||endOf(t)<=pad(H0)+':00')).map(t=>'<button class="al tk'+(!isEv(t)&&status(t).st==='late'?' late':'')+'" data-id="'+t.id+'" data-a="edit" title="'+esc(t.title)+'">'+(t.time?tRange(t)+' ':'')+esc(t.title)+'</button>').join('');
    const ex=evalsOn(ks).map(e=>'<button class="al ex" data-a="exam" data-i="'+e.i+'" style="--c:'+colM(e.materia)+'" title="'+esc(e.titulo)+'">'+(e.tentativa?'~ ':'')+(MSHORT[e.materia]||'')+': '+esc(e.titulo)+'</button>').join('');
    return '<div>'+hol+ex+tk+'</div>';
  }).join('');
  let hrs='';for(let h=H0;h<H1;h++)hrs+='<i style="top:'+((h-H0)*hh)+'px">'+(h%12||12)+' '+(h<12?'am':'pm')+'</i>';
  const cols=days.map(d=>'<div class="dc" data-d="'+ymd(d)+'" style="--hh:'+hh+'px;height:'+((H1-H0)*hh)+'px">'+blocks(d,H0,H1,hh)+'</div>').join('');
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),ti=days.findIndex(d=>ymd(d)===k0);
  const nowl=(nm>=H0*60&&nm<H1*60&&ti>-1)?'<div class="nowl" style="top:'+((nm-H0*60)/60*hh)+'px;'+(week?'left:calc(56px + (100% - 56px) * '+ti+' / 7);right:auto;width:calc((100% - 56px) / 7)':'')+'"></div>':'';
  const n=days.length,end=addDays(mon,6);
  const label=week?(mon.getMonth()===end.getMonth()?MES[mon.getMonth()]+' de '+mon.getFullYear():MESC[mon.getMonth()]+' – '+MESC[end.getMonth()]+' de '+end.getFullYear()):DOWL[days[0].getDay()]+', '+days[0].getDate()+' de '+MES[days[0].getMonth()];
  let strip='';
  if(!week){const sm=mondayOf(days[0]);for(let i=0;i<7;i++){const d=addDays(sm,i),k=ymd(d);strip+='<button class="sd'+(k===selDay?' sel':'')+(k===k0?' tdy':'')+'" data-a="day" data-d="'+k+'" aria-label="'+DOWL[d.getDay()]+' '+d.getDate()+'"><span class="w">'+DOW[d.getDay()]+'</span><span class="n">'+d.getDate()+'</span></button>'}strip='<div class="strip">'+strip+'</div>'}
  return calBanner()+
    '<div class="ctop"><button class="btn" data-a="caltoday">Hoy</button><button class="ib" data-a="calnav" data-d="-1" aria-label="Anterior">'+ICO.left+'</button><button class="ib" data-a="calnav" data-d="1" aria-label="Siguiente">'+ICO.right+'</button><h1>'+label+'</h1>'+
    '<div class="seg"><button data-a="calmode" data-m="day" aria-pressed="'+(!week)+'">Día</button><button data-a="calmode" data-m="week" aria-pressed="'+week+'">Semana</button></div></div>'+strip+
    '<div class="cgw"><div class="cg" style="--n:'+n+';--minw:'+(week?760:0)+'px">'+(week?'<div class="cg-row cg-h"><div></div>'+head+'</div>':'')+'<div class="cg-row cg-a"><div></div>'+allr+'</div>'+
    '<div class="cg-b"><div class="cg-row"><div class="hrs" style="height:'+((H1-H0)*hh)+'px">'+hrs+'</div>'+cols+'</div>'+nowl+'</div></div></div>'+
    (()=>{const seen=new Set();days.forEach(d=>{timedOn(d).concat(blocksOn(d)).forEach(e=>seen.add(e.kind));if(allDayOn(d).length)seen.add('holiday')});
      const L=['uni','hosp','work','holiday','estambul','personal'].filter(k=>seen.has(k)).map(k=>'<span><i class="sq" style="--c:'+col(k)+'"></i>'+(AREAS[k]||KIND[k])+'</span>').join('')+(/class="al tk/.test(allr)?'<span><i class="sq" style="--c:var(--accent-bg);box-shadow:inset 0 0 0 1.5px var(--accent)"></i>Entregas</span>':'');
      return L?'<div class="legend">'+L+'</div>':''})();
}

function miniMonth(){
  const t0=today(),base=new Date(t0.getFullYear(),t0.getMonth()+mmOff,1),start=mondayOf(base),k0=ymd(t0),sel=view==='cal'?selDay:'';
  const due=new Set(openDated().map(t=>t.due).concat(evals().map(e=>e.fecha)));
  let g='';['L','M','M','J','V','S','D'].forEach(x=>{g+='<span>'+x+'</span>'});
  for(let i=0;i<42;i++){const d=addDays(start,i),k=ymd(d);if(i%7===0&&i>27&&d.getMonth()!==base.getMonth())break;
    g+='<button data-a="mmday" data-d="'+k+'" class="'+(d.getMonth()!==base.getMonth()?'o ':'')+(k===k0?'t ':'')+(k===sel?'s ':'')+(due.has(k)?'d':'')+'" aria-label="'+DOWL[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+'">'+d.getDate()+'</button>'}

let NOTIF=lsGet('todo-notif')==='1';
const notified=(()=>{try{return JSON.parse(lsGet('todo-notified')||'{}')}catch(e){return {}}})();
function askNotif(){
  if(NOTIF){NOTIF=false;lsSet('todo-notif','0');toast('Avisos desactivados.');openSettings();return}
  if(!('Notification' in window)){toast('Este navegador no permite avisos. Usa las alarmas del teléfono.');return}

    if(p==='granted'){NOTIF=true;lsSet('todo-notif','1');toast('Activados. Te aviso mientras tengas la página abierta.')}
    else toast('Sin permiso no puedo avisarte. Puedes cambiarlo en el navegador.');
    openSettings();
  })}catch(e){toast('Este navegador no permite avisos desde aquí.')}
}
function tick(){
  try{if(!NOTIF||!('Notification' in window)||Notification.permission!=='granted')return}catch(e){return}
  const now=new Date(),ds=ymd(today());
  const fire=(key,msg)=>{if(notified[key])return;notified[key]=1;lsSet('todo-notified',JSON.stringify(notified));try{new Notification('Mi agenda',{body:msg})}catch(e){}};
  S.tasks.forEach(t=>{if(t.done||t.someday||t.due!==ds||!t.time||isEv(t))return;const m=(dueDate(t)-now)/6e4;if(m<=30&&m>-5)fire(t.id+ds,t.title+' · '+(m>1?'en '+Math.round(m)+' min':'ahora'))});
  agendaOn(today()).forEach(e=>{const m=(e.s-now)/6e4;if(m<=10&&m>-2)fire(e.id+ds,e.title+' · empieza '+(m>1?'en '+Math.round(m)+' min':'ahora'))});
}
let toastT=null;

}

/* Un evento siempre tiene fecha, inicio y fin (si no le pones fin, dura una hora). */

const keep=(...ks)=>{if(D&&D.man)ks.forEach(k=>{D.man[k]=D[k]})};
function fromTyping(){
  if(D.id)return;
  const p=parseCapture($('#shTitle').value),B=D.man||{};
  // Si dejas de escribir algo («reunión de 3 a 5» → «… de 3 a 5 personas»), su hora se quita; lo que elegiste a mano se queda.
  Object.assign(D,{due:B.due,time:B.time,end:B.end,someday:B.someday,prio:B.prio,area:B.area,areaSet:B.areaSet,rep:B.rep||0,endAuto:false});
  if(p.repeat)D.rep=p.repeat;
  if(p.due){D.due=p.due;D.someday=false}
  if(p.time)D.time=p.time;
  if(p.end)D.end=p.end;
  if(!D.kindSet)D.kind=p.kind==='evento'?'evento':'';
  if(p.someday){D.someday=true;D.due=null}
  if(p.prio)D.prio=true;
  if(p.area){D.area=p.area;D.areaSet=true}
  drawSheet();
}
function saveSheet(){
  micStop();
  const raw=$('#shTitle').value.trim();
  if(!raw){$('#shTitle').focus();$('#shPrev').innerHTML='<b>Escribe qué tienes pendiente.</b>';return}
  let title=raw,area=D.area;
  if(!D.id){const p=parseCapture(raw);title=p.title||raw;if(!D.areaSet&&p.area)area=p.area}
  normD();const ev=D.kind==='evento';
  if(ev&&!D.time){$('#shPrev').innerHTML='<b>Ponle hora de inicio al evento.</b>';$('#shTime').focus();return}
  const due=D.someday?null:D.due,time=due?D.time:null,end=time&&D.end&&D.end>time?D.end:null,kind=ev&&due&&time?'evento':'',prio=ev?false:D.prio,someday=ev?false:D.someday;
  if(D.id){const t=S.tasks.find(x=>x.id===D.id);if(t){Object.assign(t,{title:title,area:area,due:due,time:time,end:end,kind:kind,prio:prio,someday:someday});if(t.due&&t.created>dueDate(t))t.created=Date.now()}}
  else{
    const n=due&&D.rep>1?D.rep:1; // «cada semana»: una copia por semana
    for(let i=n-1;i>=0;i--)S.tasks.unshift({id:uid(),title:title,area:area,due:i?ymd(addDays(parseYmd(due),7*i)):due,time:time,end:end,kind:kind,prio:prio,done:false,someday:someday,created:Date.now()});
    lsSet('todo-lastarea',area);toast((ev?'Evento guardado: ':'Tarea guardada: ')+dueLabel()+(n>1?' · '+n+' semanas':''))}
  save();closeSheet();
}

document.addEventListener('click',e=>{
  const s=e.target.closest('[data-s]');
  if(s&&D){
    const a=s.dataset.s,v=s.dataset.v;
    if(a==='kind'){D.kind=v;D.kindSet=true}
    else if(a==='due'){D.someday=false;D.due=v==='none'?null:v;if(!D.due){D.time=null;D.end=null}}

  }

    const y=e.clientY-dc.getBoundingClientRect().top,m=Math.min(7*60+Math.max(0,Math.floor(y/30))*30,21*60+30);
    openSheet(null,dc.dataset.d);D.kind='evento';D.kindSet=true;D.time=pad(Math.floor(m/60))+':'+pad(m%60);keep('kind','time');drawSheet();return;
  }
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='nav'){view=b.dataset.v;window.scrollTo(0,0);render();return}
  if(a==='list'){const l=b.dataset.l;if(l==='hoy')view='hoy';else if(l==='cal')view='cal';else{view='tareas';list=l}window.scrollTo(0,0);render();return}
  if(a==='mm'){mmOff+=+b.dataset.d;render();return}
  if(a==='mmday'){const k=b.dataset.d;view='cal';selDay=k;calOff=Math.round((mondayOf(parseYmd(k))-mondayOf(today()))/6048e5);const d=parseYmd(k),t0=today();mmOff=(d.getFullYear()-t0.getFullYear())*12+d.getMonth()-t0.getMonth();if(innerWidth<1000)calMode='day';window.scrollTo(0,0);render();return}
  if(a==='exam'){openEval(b.dataset.i);return}
  if(a==='exprep'){const e=evals().find(x=>x.i===+b.dataset.i);if(e){const d=addDays(parseYmd(e.fecha),-1),k=ymd(d)<ymd(today())?ymd(today()):ymd(d);openSheet(null,k,'uni','Preparar: '+e.titulo)}return}
  if(a==='addin'){openSheet(null,b.dataset.due||undefined,b.dataset.area||undefined);return}
  if(a==='addev'){openSheet(null,b.dataset.due||undefined);D.kind='evento';D.kindSet=true;keep('kind');drawSheet();return}
  if(a==='new'){openSheet(null);return}
  if(a==='settings'){openSettings();return}
  if(a==='close2'){closeSheet2();return}
  if(a==='notif'){askNotif();return}
  if(a==='syncnow'){if(navigator.onLine===false){toast('Sin señal: se sincroniza solo cuando vuelva.');return}net='idle';render();sync();return}
  if(a==='connect'){connect();return}
  if(a==='keepses'){LOGIN=false;render();return}
  if(a==='who'){loginU=+b.dataset.n;document.querySelectorAll('.whob').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const p=$('#cfT');if(p)p.focus();return}
  if(a==='qr'){openQR();return}
  if(a==='copylink'){const l=personalLink();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Enlace copiado.'),()=>toast('No pude copiarlo.'));return}
  if(a==='logout'){logout();return}
  if(a==='ev'){openEvent(b.dataset.i);return}
  if(a==='calmode'){calMode=b.dataset.m;if(calMode==='day')selDay=calOff===0?ymd(today()):ymd(addDays(mondayOf(today()),calOff*7));render();return}
  if(a==='calnav'){const d=+b.dataset.d;if(calMode==='week'){calOff+=d}else{const nd=addDays(parseYmd(selDay),d);selDay=ymd(nd);calOff=Math.round((mondayOf(nd)-mondayOf(today()))/6048e5)}render();return}
  if(a==='caltoday'){calOff=0;mmOff=0;selDay=ymd(today());render();return}
  if(a==='day'){selDay=b.dataset.d;render();return}
  const holder=b.closest('[data-id]');if(!holder)return;const t=byId(holder.dataset.id);if(!t)return;
  const ds=ymd(today()),tm=ymd(addDays(today(),1));
  if(a==='edit'){openSheet(t);return}
  if(a==='done'){setDone(t,!t.done);return}
  const prev=JSON.stringify(t);
  if(a==='today'){t.due=ds;t.someday=false}
  else if(a==='tomorrow'){t.due=tm;t.someday=false;t.time=null}
  else if(a==='someday'){t.someday=true;t.due=null;t.prio=false;t.time=null}
  else return;
  save();render();
  toast('Tarea movida.','Deshacer',()=>{Object.assign(t,JSON.parse(prev));save();render()});
});
$('#fab').addEventListener('click',()=>openSheet(null));
$('#scrim').addEventListener('click',()=>{if(!$('#sheet2').hidden)closeSheet2();else closeSheet()});
$('#shCancel').addEventListener('click',closeSheet);
$('#shTitle').addEventListener('input',fromTyping);
document.addEventListener('change',e=>{if(e.target&&e.target.id==='shRepN'&&D){D.rep=+e.target.value;keep('rep');drawSheet()}});
$('#shDate').addEventListener('change',e=>{D.due=e.target.value||null;D.someday=false;keep('due','someday');drawSheet()});
$('#shTime').addEventListener('change',e=>{
  const v=e.target.value||null,old=D.time;D.time=v;if(v&&!D.due)D.due=ymd(today());
  if(v&&old&&D.end&&!D.endAuto){const dur=mins(D.end)-mins(old);D.end=dur>0?plusMin(v,dur):null}else if(D.endAuto)D.end=null; // mover el inicio mueve el fin
  keep('time','due','end');drawSheet();
});
$('#shEnd').addEventListener('change',e=>{
  const v=e.target.value||null;
  if(v&&D.time&&v<=D.time){toast('La hora de fin tiene que ser después de la de inicio.');drawSheet();return}
  D.end=v;D.endAuto=false;keep('end');drawSheet();
});
$('#shSave').addEventListener('click',()=>{try{saveSheet()}catch(err){toast('No pude guardar: '+((err&&err.message)||err))}});
$('#shTitle').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#shSave').click()}});
$('#shDel').addEventListener('click',()=>{
  const b=$('#shDel');

  const t=byId(D.id),idx=S.tasks.indexOf(t);S.tasks.splice(idx,1);save();closeSheet();

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetOpen){if(!$('#sheet2').hidden)closeSheet2();else closeSheet();return}

/* ---------- Avisos de conexión ---------- */
function calBanner(){
  let b='';const n=queue.length;
  if(net==='offline')b='<div class="banner"><span>Sin conexión. Lo que anotes queda guardado en este teléfono'+(n?' ('+plural(n,'cambio pendiente','cambios pendientes')+')':'')+' y se sube solo cuando vuelva la señal.</span></div>';
  else if(net==='key')b='<div class="banner bad"><span>La clave no coincide con la de tu servidor. Revísala en Ajustes.</span><button class="btn sm" data-a="settings">Ajustes</button></div>';
  else if(net==='err')b='<div class="banner bad"><span>No pude conectar con tu hoja de Google'+(n?'. Tus '+plural(n,'cambio','cambios')+' siguen guardados aquí':'')+'. Lo vuelvo a intentar solo.</span><button class="btn sm" data-a="syncnow">Reintentar</button></div>';
  if(calState.st==='err')b+='<div class="banner"><span>Tus tareas están al día, pero no pude leer tu calendario.</span><button class="btn sm" data-a="syncnow">Reintentar</button></div>';
  if(queue.some(waitsSrv))b+='<div class="banner"><span>Falta actualizar tu servidor de Google para guardar eventos y horas de fin. Mientras tanto quedan guardados en este teléfono y se suben solos después.</span></div>';
  return b;
}

/* ---------- Primera vez en un dispositivo: iniciar sesión ---------- */
let loginU=0;
function vSetup(){
  const srv=lsGet(SRV_KEY)||'',nm=loadJ('agenda-nombres',[]); // los nombres vienen en el enlace, nunca en el código público
  return '<div class="setup"><div class="brand" style="margin-bottom:26px"><span class="logo">'+ICO.check+'</span>Mi agenda</div>'+
    '<h1 style="font-size:28px">Inicia sesión</h1><p class="sub">Elige tu usuario y escribe tu PIN. Solo se pide la primera vez en cada dispositivo.</p>'+
    '<div class="lbl">¿Quién eres?</div><div class="who" role="group" aria-label="Usuario">'+[1,2].map(n=>'<button type="button" class="whob" data-a="who" data-n="'+n+'" aria-pressed="'+(loginU===n)+'"><i>'+esc(nm[n-1]?nm[n-1].charAt(0).toUpperCase():n)+'</i>'+esc(nm[n-1]||'Usuario '+n)+'</button>').join('')+'</div>'+
    (srv?'':'<label>Dirección del servidor (termina en /exec)<input id="cfU" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>')+
    '<label>PIN<input id="cfT" type="password" inputmode="numeric" autocomplete="current-password" autocapitalize="off" spellcheck="false" maxlength="64"></label>'+
    '<div class="setup-err" id="cfErr" role="status"></div><div class="sfoot" style="justify-content:flex-start"><button class="btn primary" data-a="connect">Entrar</button>'+(CFG?'<button class="btn" data-a="keepses">Seguir con la sesión de este teléfono</button>':'')+'</div></div>';
}
function connect(){
  const uEl=$('#cfU'),u=((uEl&&uEl.value)||lsGet(SRV_KEY)||'').trim(),t=($('#cfT').value||'').trim(),err=$('#cfErr');
  if(!/^https:\/\/script\.google(usercontent)?\.com\/\S+$/.test(u)){err.textContent='La dirección debe empezar por https://script.google.com/';return}
  const longKey=t.length>=20; // también acepta la clave larga del servidor
  if(!longKey&&!loginU){err.textContent='Elige tu usuario.';return}
  if(!longKey&&!/^\d{4,8}$/.test(t)){err.textContent=t?'El PIN lleva solo números.':'Escribe tu PIN.';return}
  err.textContent='Entrando…';
  (longKey?post({ops:[]},{u:u,t:t}):post({login:{user:loginU,pin:t}},{u:u,t:''})).then(res=>{
    if(!res||!res.ok){const e=res&&res.error;
      err.textContent=e==='pin'?'Ese PIN no es el de ese usuario.':e==='bloqueado'?'Demasiados intentos. Espera 15 minutos y vuelve a probar.':
        e==='clave'?(longKey?'La clave no coincide con la del servidor.':'Tu servidor todavía no tiene el inicio de sesión: falta actualizarlo.'):'El servidor respondió con un error: '+(e||'desconocido');return}
    const tok=longKey?t:res.token;if(!tok){err.textContent='El servidor no devolvió tu sesión.';return}
    if(CFG&&CFG.t!==tok){[PROF_KEY,LS,QK,BK,'agenda-cal-v1','agenda-ultima','todo-lastarea','todo-notified'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});S={tasks:[],closes:[]};queue=[];base={};calSrc={main:null,hol:null};PROF=null;applyProf()} // otra persona: nada del usuario anterior
    LOGIN=false;
    CFG={u:u,t:tok};lsSet(CFG_KEY,JSON.stringify(CFG));lsSet(SRV_KEY,u);takeProf(res);loginU=0;net='idle';render();sync();
  }).catch(e=>{err.textContent='No pude conectar. Revisa tu señal. ('+((e&&e.message)||e)+')'});
}

/* ---------- Ajustes ---------- */
function openSettings(){
  const sl=syncLabel();let perm='unsupported';try{if('Notification' in window)perm=Notification.permission}catch(e){}
  openSheet2('<h3>Ajustes</h3>'+
    '<div class="sw"><div><b>Tu hoja de Google</b><p><i class="dot '+sl.c+'" style="margin-right:6px"></i>'+esc(sl.t)+(sl.s?' · '+esc(sl.s):'')+'. Se sincroniza sola cada minuto con la app abierta y cuando vuelve la señal.</p></div><button class="btn sm" data-a="syncnow">Sincronizar</button></div>'+
    '<div class="sw"><div><b>Instalar en el iPhone</b><p>Te muestra un código QR con tu enlace personal. Escanéalo con la cámara, ábrelo en Safari y toca Compartir → Agregar a inicio.</p></div><button class="btn sm" data-a="qr">Ver QR</button></div>'+
    (calOn()?'<div class="sw"><div><b>Recordatorios</b><p>Cada tarea con fecha crea un aviso en tu calendario «To Do» de Google: a la hora (y 30 min antes) si tiene hora, o la noche anterior a las 7 pm si no. Los eventos se ven ahí con su bloque completo, como «Disponible» y privados. Activa las notificaciones de ese calendario en la app Google Calendar.</p></div></div>':
      '<div class="sw"><div><b>Recordatorios</b><p>Por ahora tu agenda no está conectada a un Google Calendar: los avisos salen solo con la app abierta.</p></div></div>')+
    '<div class="sw"><div><b>Avisos con la app abierta</b><p>Te avisan 30 minutos antes de lo que tiene hora y 10 minutos antes de una reunión, mientras la app esté abierta.</p></div><button class="btn sm" data-a="notif">'+(NOTIF?'Desactivar':perm==='denied'?'Bloqueados':'Activar')+'</button></div>'+
    '<div class="sw"><div><b>Sesión'+(PROF&&PROF.user?': usuario '+PROF.user+(PROF.name?' · '+esc(PROF.name):''):'')+'</b><p>Cerrar sesión borra la copia de tus tareas en este dispositivo. Tus tareas siguen guardadas.</p></div><button class="btn sm danger" data-a="logout">Cerrar sesión</button></div>'+
    '<p style="margin:14px 0 0;font:400 11.5px/1.5 var(--f-sans);color:var(--ink2);overflow-wrap:anywhere">Diagnóstico · conexión: '+esc(net+(netErr?' ('+netErr+')':''))+' · calendario: '+esc(calState.st+(calErr?' ('+calErr+')':''))+' · cambios en cola: '+queue.length+'</p>'+
    '<div class="sfoot"><button class="btn primary" data-a="close2">Listo</button></div>');
}
let qrP=null;
function loadQR(){
  if(window.QRCode)return Promise.resolve();
  if(!qrP)qrP=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=ok;s.onerror=()=>{qrP=null;ko()};document.head.appendChild(s)});
  return qrP;
}
function openQR(){
  const link=personalLink();if(!link)return;
  openSheet2('<h3>Tu enlace personal</h3><p class="sub" style="margin:0 0 8px">Escanéalo con la cámara del iPhone y ábrelo en Safari. No lo compartas: es la llave de tu agenda.</p><div class="qr" id="qrBox">Cargando…</div><div class="sfoot"><button class="btn" data-a="copylink">Copiar enlace</button><button class="btn primary" data-a="close2">Listo</button></div>');
  loadQR().then(()=>{const box=$('#qrBox');if(!box)return;box.textContent='';new window.QRCode(box,{text:link,width:232,height:232,correctLevel:window.QRCode.CorrectLevel.M})})
    .catch(()=>{const box=$('#qrBox');if(box)box.textContent='No pude cargar el generador de QR. Usa «Copiar enlace».'});
}
function logout(){
  if(!window.confirm('¿Cerrar sesión en este dispositivo? Tus tareas siguen guardadas.'))return;
  [CFG_KEY,PROF_KEY,LS,QK,BK,'agenda-cal-v1','agenda-ultima','todo-lastarea','todo-notified'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  CFG=null;PROF=null;applyProf();loginU=0;view='hoy';list='prog';S={tasks:[],closes:[]};queue=[];base={};calSrc={main:null,hol:null};net='idle';closeSheet2();
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  render();
}

/* ---------- Dictado por voz (español o inglés) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,micState='off',micLang=lsGet('agenda-voz')||'es-US',lastTap=0,micT=null;
function micUI(){
  const b=$('#shMic'),t=$('#micTxt');
  if(b){b.classList.toggle('on',micState==='on');b.classList.toggle('wait',micState==='wait');b.setAttribute('aria-label',micState==='off'?'Dictar por voz':'Detener dictado')}
  if(t)t.textContent=micState==='wait'?'Activando el micrófono…':micState==='on'?'Te escucho. Toca el micrófono para terminar.':'Dictar en';
  document.querySelectorAll('#micBar [data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===micLang)));
}
function micStop(){clearTimeout(micT);if(rec){try{rec.stop()}catch(e){}}}
function micStart(){
  const now=Date.now();if(now-lastTap<800)return;lastTap=now; // un segundo toque accidental no lo apaga
  if(rec){micStop();return}
  if(!SR){$('#shTitle').focus();toast('Toca el micrófono del teclado para dictar.');return}
  const r=new SR();rec=r;r.lang=micLang;r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
  const before=$('#shTitle').value.trim();
  try{$('#shTitle').blur()}catch(e){}
  micState='wait';micUI();
  const quiet=ms=>{clearTimeout(micT);micT=setTimeout(()=>{if(rec===r)micStop()},ms)};
  r.onstart=()=>{if(rec===r){micState='on';micUI();quiet(7000)}}; // si no hablas en 7 s, se apaga solo
  r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;$('#shTitle').value=(before?before+' ':'')+s.trim();fromTyping();quiet(1800)}; // casi 2 s de silencio = terminaste
  r.onerror=e=>{const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed')toast('Permite el micrófono para dictar, o usa el del teclado.');
    else if(c==='network')toast('El dictado de la app necesita señal. Sin señal, usa el micrófono del teclado.');
    else if(c==='no-speech')toast('No te escuché. Toca el micrófono y habla.');
    else if(c&&c!=='aborted')toast('No pude escuchar ('+c+').')};
  r.onend=()=>{clearTimeout(micT);if(rec===r){rec=null;micState='off';micUI()}};
  try{r.start()}catch(e){rec=null;micState='off';micUI();toast('No pude activar el micrófono. Usa el del teclado.');return}
  setTimeout(()=>{if(rec===r&&micState==='wait'){try{r.abort()}catch(e){}rec=null;micState='off';micUI();toast('El micrófono no respondió. Prueba otra vez o usa el del teclado.')}},4000);
}

/* ---------- Arranque ---------- */
S=loadJ(LS,null);if(!S||!Array.isArray(S.tasks))S={tasks:[],closes:[]};if(!S.closes)S.closes=[];
S.tasks.forEach(t=>{if(!AREAS[t.area])t.area='personal'});
render();tick();micUI();
setInterval(()=>{if(!sheetOpen)render();tick()},60000);
setInterval(()=>{if(document.visibilityState!=='hidden')sync()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
window.addEventListener('online',()=>{net='idle';sync()});
window.addEventListener('offline',()=>{net='offline';render()});
$('#shMic').addEventListener('click',micStart);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='cfT'||e.target.id==='cfU')){e.preventDefault();connect()}});
$('#micBar').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;micLang=b.dataset.lang;lsSet('agenda-voz',micLang);if(rec)micStop();micUI()});
$('#fabMic').addEventListener('click',()=>{openSheet(null,undefined,undefined,undefined,true);micStart()});
sync();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
